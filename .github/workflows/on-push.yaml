name: On Push

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: builderhub/actions-internal/.github/workflows/build-push-image.yaml@main
    with:
      build-type: nix
      image-name: build-console
      local-image-name: builderhub-console
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
